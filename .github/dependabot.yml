version: 2
updates:
  # pip не используется: Dependabot не умеет разбирать зависимость -e ../project-b (путь вне репозитория)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
